<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Odyssey Voyage</title>
  
  <style>
    /* ========================================================
       🎨 글로벌 레이아웃 및 웹 가시성 최적화
       ======================================================== */
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }
    
    body {
      background: linear-gradient(to bottom, #08111d, #10243b);
      font-family: Georgia, serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: -webkit-fill-available; /* iOS 15+ 모바일 뷰포트 스크롤 방지 패치 */
    }

    .app {
      width: 100%;
      height: 100%;
      max-width: 480px; 
      background: #08111d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    /* ========================================================
       👑 상단 헤더 및 챕터 드롭다운 선택창
       ======================================================== */
    .app-header {
      background: #0b192c;
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 2px solid #52351e;
      z-index: 30;
    }

    .chapter-select {
      width: 100%;
      padding: 10px 12px;
      background: #1e130c;
      color: #fff5dc;
      border: 1px solid #7a532f;
      border-radius: 6px;
      font-family: Georgia, serif;
      font-size: 0.95rem;
      font-weight: bold;
      outline: none;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      appearance: none; /* 크롬/사파리 기본 화살표 스타일 초기화 */
      -webkit-appearance: none;
    }

    /* ========================================================
       📚 EBOOK 영역
       ======================================================== */
    .ebook {
      flex: 1; 
      padding: 16px 16px 8px 16px; 
      position: relative;
      background: #3b2b1f; /* 이미지 미로드시 대체 배경 */
      overflow: hidden;
    }

    .page {
      position: relative;
      height: 100%; 
      background: rgba(255, 246, 222, 0.9); 
      border-radius: 16px;
      padding: 24px 20px 75px; 
      overflow-y: auto; 
      box-shadow: inset 0 0 15px rgba(90,58,31,0.15), 0 4px 15px rgba(0,0,0,0.2);
      -webkit-overflow-scrolling: touch; 
    }

    .chapter-title {
      text-align: center;
      font-size: 1.3rem; 
      color: #3c2415;
      margin-bottom: 16px;
      font-weight: bold;
      text-shadow: 0 1px 1px rgba(255,255,255,0.6);
    }

    .page-text {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #23160e;
      white-space: pre-line;
      padding-bottom: 10px;
      font-weight: 500; 
    }

    .page-footer {
      position: absolute;
      bottom: 25px; 
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 246, 222, 0.95);
      padding: 4px 14px;
      border-radius: 20px;
      z-index: 5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      white-space: nowrap;
      border: 1px solid rgba(122, 83, 47, 0.2);
    }

    .page-indicator {
      font-size: 0.8rem;
      color: #3b2b1f;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 60px;
      width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: rgba(60,36,21,0.4);
      background: rgba(255, 246, 222, 0.4);
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s ease, color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .prev-btn { left: 24px; }
    .next-btn { right: 24px; }
    .nav-btn:hover { color: rgba(60,36,21,0.8); background: rgba(255, 246, 222, 0.7); }

    /* ========================================================
       ⚓ SHIP UI (미디어 플레이어 하단 대시보드 컴포넌트)
       ======================================================== */
    .ship-ui {
      height: 28vh; 
      min-height: 180px;
      background: #08111d;
      display: flex;
      justify-content: center; 
      align-items: center;
      position: relative;
      z-index: 20; 
      box-shadow: 0 -8px 25px rgba(0,0,0,0.5);
      border-top: 3px solid #52351e;
    }

    /* 원형 미디어 트랙 마스킹 박스 */
    .wheel {
      width: 140px;  
      height: 140px;
      border-radius: 50%; 
      overflow: hidden;
      border: 5px solid #6b4627; 
      box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 15px #000;
      background: #000;
      position: relative;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      backface-visibility: hidden;
      transform: translate3d(0, 0, 0);
    }

    .player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 50%;
    }

    #player { 
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180%;       
      height: 100%;      
      object-fit: cover;
      pointer-events: auto; 
      border: none;
    }

    @media (max-width: 480px) {
      .nav-btn { display: none; } /* 모바일 디바이스 가독성을 위해 터치 스와이프 우선 처리 및 버튼 숨김 */
      .ship-ui { height: 26vh; }
      .wheel { 
        width: 125px; 
        height: 125px; 
      } 
      #player { 
        width: 190%; 
        height: 105%; 
      }
    }
  </style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <select id="chapter-select" class="chapter-select" onchange="onDropdownChange(this)"></select>
  </header>

  <section class="ebook">
    <div id="prev-btn" class="nav-btn prev-btn" onclick="prevPage()">◀</div>
    <div id="next-btn" class="nav-btn next-btn" onclick="nextPage()">▶</div>
    
    <div class="page" id="page">
      <div class="chapter-title" id="chapter-title"></div>
      <div class="page-text" id="page-text"></div>
      
      <div class="page-footer">
        <div class="page-indicator" id="page-indicator"></div>
      </div>
    </div>
  </section>

  <section class="ship-ui">
    <div class="wheel">
      <div class="player-wrapper">
        <div id="player"></div>
      </div>
    </div>
  </section>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  /* ========================================================
     📚 데이터 딕셔너리
     ======================================================== */
  const chapters = [
    {
      title: "I. The Council of the Gods",
      youtubeId: "jisnC7cIri0",
      stopTime: 171, 
      pages: [
        `“Tell me, O Muse, of that ingenious hero who travelled far and wide after he had sacked the famous town of Troy. Many cities did he visit, and many were the nations with whose manners and customs he was acquainted; moreover he suffered much by sea while trying to save his own life and bring his men safely home; but do what he might he could not save his men…” (Butler)`,
        `The gods held a council, a meeting, in which the fate of Odysseus was discussed. He had lost every single man from his crew, and was currently held captive by the goddess Calypso, where he wept day and night to return home and see his wife and son.`,
        `Athena, who favored the clever, was a champion of Odysseus, and pleaded with her father Zeus, ruler of the gods, to help Odysseus home: \n\n“ …my heart bleeds, when I think of his sufferings in that lonely sea- girt island, far away, poor man, from all his friends…” (Butler)`,
        `Zeus agreed that Odysseus was a capable man, pleased with his many offerings, but reminded Athena that Poseidon the earth-shaker was still very angry with Odysseus—angry about the Trojans’ defeat, and especially about his son.`,
        `After some debate, Athena got permission from her father Zeus to help Odysseus. Losing no time, she went to his home island of Ithaca to inspire Odysseus’ son, Telemachus, into action.`,
        `Athena disguised herself as Mentes, king of the Taphians, before she arrived at the house of Odysseus. His house was a grand and sprawling estate, for Odysseus was king and ruler over Ithaca. There she found Telemachus, a young man just grown to adulthood, sitting gloomily amongst a large crowd of men feasting, and playing music and games.`
      ]
    },
    {
      title: "II. Telemachus and the Suitors",
      youtubeId: "ZU_jvT2yTAI", 
      stopTime: 186, 
      pages: [
        `Spotting the newcomer, Telemachus gave the visitor a warm welcome—preparing a seat in the great hall, setting out a table full of food and wine, as he explained his situation at home.\n\n“I hope, sir, ” said he, “that you will not be offended with what I am going to say. Singing comes cheap to those who do not pay for it, and all this is done at the cost of one whose bones lie rotting in some wilderness or grinding to powder in the surf ... ” (Butler)`,
        `The feasting men were the strongest and brightest of Ithaca and surrounding lands, all hoping to win the hand of Penelope the queen, if only she would pick a suitor.\n\nBut Penelope was still loyal to her husband, and refused to choose another, even though it had been almost twenty years since he departed for the war at Troy.`,
        `Penelope’s days and nights swung back and forth between clinging to slim hope for her husband’s return, and falling into despair that he might truly be dead.\n\nSo in the meantime, these suitors had overrun the house, eating all their food, drinking all their wine, and slaughtering large quantities of the royal cattle and sheep every day for feasting and sacrifices.`,
        `Meanwhile, Telemachus, who was just a baby when Odysseus left, had lost all hope for his father’s return.`,
        `“Savages!,” Athena (as Mentes) said of the suitors. “I knew Odysseus well, for our fathers were friends, and the Odysseus I remember would return as a terrible storm of vengeance upon these suitors, for truly, their insult to your house deserves no mercy.`,
        `But whether he is to return or not, his fate lies with the gods, of course. But you are no longer a boy; you have inherited the fine features of your father, so you should take action like your father as well.\n\nDon’t sit and suffer. Take a ship and crew, sail out to seek answers about your father’s fate, for better or worse. It is time for your part in the story to be written.”`
      ]
    },
    {
      title: "III. Telemachus's Journey",
      youtubeId: "s8NlPKl3Q54",
      stopTime: 140, 
      pages: [
        `Telemachus took this advice to heart and secretly set sail to Pylos, the home of King Nestor, who had fought at the battle of Troy alongside Odysseus.`,
        `Through Nestor, Telemachus learned about the fates of many key heroes of the Trojan War. However, Nestor did not know what might have happened to Odysseus.`,
        `Telemachus next traveled to King Menelaus, husband of Helen, around whom the entire war with Troy began. There, Menelaus recounted the clever genius of Odysseus, for it was his idea to build that wooden horse.`,
        `He also described Odysseus's courage and gift for leadership, and all there mourned the absent hero.`,
        `Through his own long travels home, Menelaus had met an immortal and ancient being named Proteus, who told him: "Odysseus, who dwells in Ithaca—I can see him in an island, sorrowing bitterly in the house of the nymph Calypso, who is keeping him prisoner; and he cannot reach his home, for he has no ships nor sailors to take him over the sea."`,
        `This was the only news he had, but it was hopeful news indeed for Telemachus. As was the custom, he stayed a while as a guest at the house of Menelaus. Meanwhile, back on Ithaca, the suitors learned of Telemachus' journey and began plotting an ambush to kill him on his return trip home.`
      ]
    },
    {
      title: "IV. Calypso and Poseidon's Storm",
      youtubeId: "7c5orkcGTQc",
      stopTime: 153, 
      pages: [
        `A new day dawned. Zeus sent word to Calypso with orders to set Odysseus free. Calypso wasn't happy but had to follow the will of Zeus or suffer the consequences.`,
        `She gave Odysseus tools to build a raft and sail home. Odysseus set sail and was nearing the land of Phaeacia when the earth-shaker, the god Poseidon, spotted the wooden raft upon calm waters.`,
        `He could see him sailing upon the sea, and it made him very angry. So he wagged his head and muttered to himself, saying: "Good heavens! So the gods have been changing their minds about Odysseus while I was away. Still, he shall have plenty of hardship yet before he has done with it."`,
        `Poseidon gathered together all his clouds, then with his giant trident stirred round and round the waters of the sea until a tremendous storm began to rage.`,
        `Odysseus was thrown overboard and struggled long under the water. With his very last ounce of strength, Odysseus raised his head above water and grabbed onto the raft.`,
        `Blessed by the favor of Athena and with help from a marine goddess, Odysseus made it safely to the shores of Phaeacia. There, he was discovered by the princess of that land, Nausicaa.`,
        `She showed him the way to her palace and instructed Odysseus: "When you come to our court, you'll find the king and queen seated beside each other. My mother the queen will be spinning purple wool. Don't go to my father, but go to my mother first. Bow at her knees and announce yourself. And if you can speak well and please her, she can ensure your welcome by the court and your safe return home, no matter how far it may be."`
      ]
    },
    {
      title: "V. The Feast of Phaeacians",
      youtubeId: "ZkT3T7Damf8",
      stopTime: 169, 
      pages: [
        `When Odysseus reached the palace where the royal court was gathered, he did just as Nausicaa had advised and fell upon the floor at the foot of the queen. "Queen Arete," he exclaimed, "daughter of great Rhexenor, in my distress I humbly pray you, as also your husband and these your guests whom may heaven prosper with long life and happiness, to help me home to my own country as soon as possible, for I have been long in trouble and away from my friends."`,
        `Odysseus was a master speaker. He honored his audience elegantly with high praise, and yet his plea was humble and honest, earning the sympathy of the Phaeacians.`,
        `He was not only welcomed but also thrown a feast by the generous King Alcinous. At the feast, a blind poet who performed for the court was called to sing about the famous war at Troy, no one knowing the hero of that song was none other than their new unnamed guest.`,
        `Odysseus was overcome with emotion to hear in song his very own experiences—the hushed and restless weight inside the great wooden horse, the feverish rush of their surprise attack on Troy. Just hearing the names of his dear comrades, Menelaus, Achilles, made Odysseus begin to weep uncontrollably.`,
        `King Alcinous, hearing his sobs, ordered the singing to stop and urged his guest to finally reveal his identity and share why the story of Troy caused him so much pain: "And now tell me, and tell me true... did you lose some brave kinsman of your wife's when you were before Troy, a son-in-law or father-in-law? Or was it some brave and kindly-natured comrade? For a good friend is as dear to a man as his own brother."`
      ]
    }
  ];

  /* ========================================================
     ⚙️ 시스템 제어 모듈
     ======================================================== */
  let currentChapter = 0;
  let currentPage = 0;
  let player;
  let timeCheckInterval; 

  function initDropdown() {
    const select = document.getElementById("chapter-select");
    select.innerHTML = "";
    chapters.forEach((chap, index) => {
      const opt = document.createElement("option");
      opt.value = index;
      opt.innerText = chap.title;
      select.appendChild(opt);
    });
  }

  function renderPage() {
    if (!chapters || !chapters[currentChapter]) return;

    const chapter = chapters[currentChapter];
    document.getElementById("chapter-title").innerText = chapter.title;
    document.getElementById("page-text").innerText = chapter.pages[currentPage];
    document.getElementById("page-indicator").innerText = `Chapter ${currentChapter + 1} ⚓ Page ${currentPage + 1} / ${chapter.pages.length}`;

    document.getElementById("page").scrollTop = 0;
    document.getElementById("chapter-select").value = currentChapter;
  }

  function nextPage() {
    const chapter = chapters[currentChapter];
    if (currentPage < chapter.pages.length - 1) {
      currentPage++;
      renderPage();
    } else {
      if (currentChapter < chapters.length - 1) {
        currentChapter++;
        currentPage = 0;
        syncVideoToChapter();
        renderPage();
      }
    }
  }

  function prevPage() {
    if (currentPage > 0) {
      currentPage--;
      renderPage();
    } else {
      if (currentChapter > 0) {
        currentChapter--;
        currentPage = chapters[currentChapter].pages.length - 1;
        syncVideoToChapter();
        renderPage();
      }
    }
  }

  function onDropdownChange(selectElement) {
    const targetIdx = parseInt(selectElement.value, 10);
    if (targetIdx !== currentChapter) {
      currentChapter = targetIdx;
      currentPage = 0; // 다른 챕터로 전환 시 인덱스를 항상 처음으로 리셋
      syncVideoToChapter();
      renderPage();
    }
  }

  function syncVideoToChapter() {
    if (player && player.loadVideoById) {
      player.loadVideoById({
        videoId: chapters[currentChapter].youtubeId,
        startSeconds: 0
      });
    }
  }

  // 모바일 환경에서의 가로 스와이프 인터랙션 바인딩
  window.addEventListener("DOMContentLoaded", () => {
    initDropdown();
    renderPage();

    let touchStartX = 0;
    let touchStartY = 0;
    const pageElement = document.getElementById("page");

    pageElement.addEventListener("touchstart", e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    pageElement.addEventListener("touchend", e => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      
      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;

      // 상하 스크롤링 동작 방해를 피하기 위한 검증식 추가
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
        if (diffX > 0) nextPage(); 
        else prevPage(); 
      }
    }, { passive: true });
  });

  // 유튜브 Iframe API 로더 핸들러
  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player("player", {
      videoId: chapters[0].youtubeId,
      playerVars: {
        'controls': 0,          /* 깔끔한 디자인 유지를 위해 비디오 내부 컨트롤바 숨김 처리 */
        'modestbranding': 1,
        'rel': 0,
        'playsinline': 1,
        'autoplay': 0
      },
      events: {
        'onStateChange': onPlayerStateChange
      }
    });
  };

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) { 
      startTimeMonitor();
    } else {
      stopTimeMonitor();
    }

    if (event.data === YT.PlayerState.ENDED) { 
      const chapter = chapters[currentChapter];
      if (currentPage === chapter.pages.length - 1) {
        if (currentChapter < chapters.length - 1) {
          currentChapter++;
          currentPage = 0;
          syncVideoToChapter();
          renderPage();
        }
      }
    }
  }

  function startTimeMonitor() {
    stopTimeMonitor(); 
    timeCheckInterval = setInterval(() => {
      if (player && player.getCurrentTime) {
        const currentTime = player.getCurrentTime();
        const maxLimitTime = chapters[currentChapter].stopTime;
        
        if (currentTime >= maxLimitTime) {
          player.pauseVideo();
          stopTimeMonitor();
        }
      }
    }, 400); 
  }

  function stopTimeMonitor() {
    if (timeCheckInterval) {
      clearInterval(timeCheckInterval);
    }
  }
</script>
</body>
</html>
